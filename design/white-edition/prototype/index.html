<style>

}

  --font: "Anuphan", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Leelawadee UI", Thonburi, "Noto Sans Thai UI", "Noto Sans Thai", sans-serif;
  /* motion: 5 curves + linear (spec 06) */

  --e2: 0 0 0 1px rgb(20 26 44/.05), 0 2px 4px rgb(20 26 44/.04), 0 12px 28px -8px rgb(20 26 44/.12), 0 32px 64px -32px rgb(20 26 44/.18);

  --kram: #E0E8F9; --on-kram: #171F30; --kram-hover: #ECF1FB; --kram-press: #D3DDF4;
  --link: #91AAE1; --focus: #91AAE1; --select: #2E3C5D; --out-hover: #1C2230;

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--canvas); -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
body {
  margin: 0; background: var(--canvas); color: var(--ink-1); font-family: var(--font);
  font-size: 1.0625rem; line-height: 1.5; letter-spacing: -.022em; overflow-x: clip;
  font-synthesis-style: none; -webkit-font-smoothing: antialiased;
}
html[lang="th"] body { line-height: 1.65; letter-spacing: 0; }
:lang(th) em, :lang(th) i { font-style: normal; font-weight: 600; }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: .12em; }
html[lang="th"] a { text-underline-offset: .3em; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
::selection { background: var(--select); color: var(--ink-1); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.kt { display: inline-block; max-width: 100%; }
.nw { white-space: nowrap; }
.ic { width: 1em; height: 1em; fill: currentColor; flex: none; }
.ln { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.wrap { width: min(980px, 100% - 40px); margin-inline: auto; }
@media (max-width: 360px) { .wrap { width: calc(100% - 32px); } .h1 { font-size: 36px !important; line-height: 40px !important; } html[lang="th"] .h1 { font-size: 31px !important; line-height: 40px !important; } }
.skip { position: fixed; left: 12px; top: -80px; z-index: 100; background: var(--kram); color: var(--on-kram); padding: 12px 16px; border-radius: 12px; font-size: 15px; text-decoration: none; }
.skip:focus { top: 12px; }
section[id], [id^="ch-"] { scroll-margin-top: 76px; }

/* ---------- type (spec 04) ---------- */
.h1 { margin: 0; font-size: clamp(40px, 4.45vw, 64px); line-height: 1.04; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
html[lang="th"] .h1 { font-size: clamp(34px, 3.9vw, 56px); line-height: 1.3; letter-spacing: 0; }
.h2 { margin: 0; font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -.003em; text-wrap: balance; }
html[lang="th"] .h2 { font-size: 44px; line-height: 57px; letter-spacing: 0; }
.eyebrow { margin: 0 0 10px; font-size: 21px; line-height: 25px; font-weight: 600; color: var(--ink-2); letter-spacing: .011em; }
html[lang="th"] .eyebrow { line-height: 28px; letter-spacing: 0; }
.lead { margin: 14px 0 0; font-size: 21px; line-height: 29px; color: var(--ink-2); letter-spacing: .011em; text-wrap: pretty; }
html[lang="th"] .lead { line-height: 32px; letter-spacing: 0; }
.cap { font-size: 14px; line-height: 20px; color: var(--ink-2); letter-spacing: -.016em; }
html[lang="th"] .cap { line-height: 22px; letter-spacing: 0; }
.dbr { display: inline; }
@media (max-width: 1068px) {
  .h2 { font-size: 40px; line-height: 44px; letter-spacing: 0; }
  html[lang="th"] .h2 { font-size: 36px; line-height: 47px; }
}
@media (max-width: 734px) {
  .dbr { display: none; }
  .h1 { font-size: 40px; line-height: 44px; letter-spacing: 0; }
  html[lang="th"] .h1 { font-size: 36px; line-height: 47px; }
  .h2 { font-size: 32px; line-height: 36px; letter-spacing: .004em; }
  html[lang="th"] .h2 { font-size: 28px; line-height: 38px; }
  .eyebrow { font-size: 17px; line-height: 21px; }
  html[lang="th"] .eyebrow { line-height: 23px; }
  .lead { font-size: 19px; line-height: 27px; }
  html[lang="th"] .lead { line-height: 29px; }
}

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 22px; border: 0; font-size: 17px; font-weight: 500; line-height: 1.2; text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform 220ms var(--ease-settle), background-color 200ms linear; }
.btn:active { transform: scale(.97); transition-duration: var(--dur-tap); }
.btn.fill { background: var(--kram); color: var(--on-kram); }
.btn.out { background: transparent; color: var(--ink-1); box-shadow: inset 0 0 0 1px var(--ink-3); }
.lnk { color: var(--link); text-decoration: none; font-size: 17px; display: inline-flex; align-items: center; min-height: 44px; }
.lnk:hover { text-decoration: underline; }
@media (hover: hover) and (pointer: fine) {
  .btn.fill:hover { background: var(--kram-hover); }
  .btn.out:hover { background: var(--out-hover); }
}
.seg { display: inline-flex; padding: 2px; border-radius: 16px; background: var(--ctl); gap: 2px; }
.seg button { min-height: 28px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 14px; background: transparent; font-size: 14px; cursor: pointer; color: var(--ink-1); position: relative; }
.seg button::after { content: ""; position: absolute; inset: -8px -1px; }
.seg button[aria-pressed="true"] { background: var(--canvas); box-shadow: var(--e1); font-weight: 600; }

/* ---------- glass ---------- */
.glass { isolation: isolate; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(var(--sat)); backdrop-filter: blur(20px) saturate(var(--sat));
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-edge), 0 0 0 1px var(--glass-rim), var(--e3); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, var(--sheen), transparent 45%); pointer-events: none; z-index: -1; }
.glass.pill { background: var(--pill); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); }
.ctl { background: var(--ctl); -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%); border: 0; color: var(--ink-1); cursor: pointer; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass, .glass.pill { background: var(--canvas); } .ctl { background: var(--mist); }
}
@media (prefers-reduced-transparency: reduce) { .glass, .glass.pill { background: var(--canvas); -webkit-backdrop-filter: none; backdrop-filter: none; } .ctl { background: var(--mist); } }
@media (prefers-contrast: more) { .glass, .glass.pill { background: var(--canvas); box-shadow: 0 0 0 2px var(--ink-1); } :root { --ink-2: #4A4D54; } }
@media (forced-colors: active) { .glass, .glass.pill { border: 1px solid CanvasText; } }

/* ---------- nav capsule (spec 09 + 10) ---------- */
.navwrap { position: sticky; top: 0; z-index: 50; padding: 10px 24px 0; display: flex; justify-content: center; pointer-events: none; }
.cap-nav { pointer-events: auto; position: relative; width: min(1024px, 100%); height: 52px; border-radius: 18px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 14px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-1); text-decoration: none; font-size: 17px; font-weight: 600; min-height: 44px; }
.mono { width: 28px; height: 28px; border-radius: 50%; background: var(--ink-1); color: var(--canvas); display: grid; place-items: center; font-size: 14px; font-weight: 600; letter-spacing: 0; }
.nlinks { position: relative; display: flex; gap: 4px; margin-left: auto; contain: layout paint; padding: 12px 0; }
.nlinks a { position: relative; z-index: 1; font-size: 14px; line-height: 28px; padding: 0 12px; border-radius: 14px; color: var(--ink-1); opacity: .8; text-decoration: none; }
.nlinks a:hover { opacity: 1; }
.nlinks a[aria-current] { opacity: 1; font-weight: 600; }
.nact { position: absolute; left: 0; top: 12px; height: 28px; width: 0; border-radius: 14px; background: color-mix(in srgb, var(--ink-1) 7%, transparent); opacity: 0; transition: transform var(--dur-ui) var(--ease-settle), width var(--dur-ui) var(--ease-settle), opacity 200ms linear; }
.nright { display: flex; align-items: center; gap: 8px; }
.icon-b { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; font-size: 17px; cursor: pointer; position: relative; color: var(--ink-1); }
.icon-b::after { content: ""; position: absolute; inset: -6px; }
.icon-b:hover { background: color-mix(in srgb, var(--ink-1) 6%, transparent); }
.npill { position: relative; min-height: 28px; padding: 0 14px; border-radius: 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; text-decoration: none; color: var(--ink-1); box-shadow: inset 0 0 0 1px var(--ink-3); transition: background-color 200ms linear, color 200ms linear; white-space: nowrap; }
.npill::after { content: ""; position: absolute; inset: -8px -2px; }
.npill.filled { background: var(--kram); color: var(--on-kram); box-shadow: none; }
.menu-b { display: none; }
@media (max-width: 899px) {
  .nlinks, .nsearch, .ncontact { display: none; }
  .nright { margin-left: auto; }
  .menu-b { display: inline-flex; min-height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--ink-3); font-size: 14px; font-weight: 500; align-items: center; cursor: pointer; position: relative; color: var(--ink-1); }
  .menu-b::after { content: ""; position: absolute; inset: -6px -2px; }
}
@media (max-width: 734px) {
  .navwrap { padding: calc(8px + env(safe-area-inset-top)) 16px 0; }
  .cap-nav { border-radius: 16px; padding: 0 8px 0 10px; }
  .brand { font-size: 15px; }
}

/* ---------- hero + tour (spec 02, 06) ---------- */
.hero { padding-top: 28px; text-align: center; }
.byline { margin: 0 0 22px; display: inline-flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; }
.byline img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: 50% 38%; box-shadow: inset 0 0 0 1px rgb(20 26 44 / .08); }
.hero .h1 { max-width: 12.5em; margin-inline: auto; }
.hsub { margin: 12px auto 0; font-size: 21px; line-height: 29px; color: var(--ink-2); max-width: 40em; }
html[lang="th"] .hsub { line-height: 32px; }
.ctas { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 24px; flex-wrap: wrap; }
.tour { position: relative; margin-top: 32px; }
.stage-z { width: min(1040px, 100% - 48px); margin: 0 auto; transform-origin: 50% 100%; }
.stage { position: relative; aspect-ratio: 20 / 9; border-radius: 28px; overflow: hidden; background: var(--w-aje); contain: layout paint; touch-action: pan-y; }
.slide { position: absolute; inset: 0; background: var(--w); opacity: 0; visibility: hidden; }
.slide.on { opacity: 1; visibility: visible; }
.slide.top { z-index: 2; }
.card { position: absolute; left: 7%; width: 86%; top: 40px; aspect-ratio: 1580 / 900; border-radius: 14px; overflow: hidden; box-shadow: var(--e2); background: var(--canvas); }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .14); pointer-events: none; }
.card img { width: 100%; height: 100%; object-fit: cover; transform-origin: var(--fx, 50%) var(--fy, 50%); }
.slide[data-w="gonai"] .card img, .vig { filter: var(--shot-dim); }
/* klao-site vignette: HTML, Notion row -> this page (spec 02) */
.vig { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1.15fr; text-align: left; background: #fff; color: #1A1C20; }
.vig-n { padding: 28px 26px; border-right: 1px solid rgb(20 26 44/.08); font-size: 14px; }
.vig-n .vt { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #666970; text-transform: uppercase; margin-bottom: 14px; }
.vrow { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgb(20 26 44/.08); position: relative; }
.vrow b { font-weight: 500; color: #666970; font-size: 13px; }
.vrow span { font-size: 14px; line-height: 20px; }
.vrow .ul { position: absolute; left: 100px; right: 0; bottom: -1px; height: 2px; background: #26314A; transform: scaleX(0); transform-origin: 0 50%; transition: transform 300ms var(--ease-settle); }
.vrow.act .ul { transform: none; }
.vig-h { display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; position: relative; }
.vig-h img { width: 36px; height: 36px; border-radius: 50%; }
.vig-h .vh1 { grid-area: 2 / 1; font-size: 24px; line-height: 1.2; font-weight: 600; max-width: 15em; transition: opacity 500ms var(--ease-glide); }
.vig-h .vh1.th { line-height: 1.35; }
.vig-h .vh1.off { opacity: 0; }
.vig-h small { grid-area: 3 / 1; font-size: 12px; color: #666970; }
.paddle { display: none; position: absolute; top: 50%; z-index: 4; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; place-items: center; font-size: 16px; }
.paddle::after { content: ""; position: absolute; inset: -4px; }
.paddle.prev { left: 16px; } .paddle.next { right: 16px; }
html:not(.motion) .paddle { display: grid; }
.tpill { position: sticky; bottom: 24px; z-index: 6; margin: -28px auto 0; width: min(760px, 100% - 48px); min-height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 8px 18px 8px 8px; text-align: left; }
.tplay { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; flex: none; }
.tplay::after { content: ""; position: absolute; inset: -2px; }
html:not(.motion) .tplay { display: none; }
.tcap { flex: 1; min-width: 0; display: grid; }
.tq { justify-self: start; max-width: 100%; border: 0; background: none; padding: 0; margin: 0; text-align: left; cursor: pointer; font-size: 17px; line-height: 22px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 24px; }
.tq .chev { display: inline-block; margin-left: 4px; transition: transform 200ms var(--ease-settle); }
.tq:hover .tqt { text-decoration: underline; text-underline-offset: .15em; }
.tq:hover .chev { transform: translateX(2px); }
.tk { font-size: 13px; line-height: 18px; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[lang="th"] .tk { line-height: 20px; }
.tcap.swap { animation: capin 300ms var(--ease-settle) both; }
@keyframes capin { from { opacity: 0; transform: translateY(4px); } }
.tdots { display: flex; align-items: center; gap: 0; flex: none; contain: layout paint; }
.tdot { width: 24px; height: 24px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
.tdot i { display: block; width: 8px; height: 8px; border-radius: 4px; background: var(--ink-3); overflow: hidden; position: relative; transition: width var(--dur-ui) var(--ease-settle); }
.tdot[aria-selected="true"] i { width: 36px; background: color-mix(in srgb, var(--ink-1) 22%, transparent); }
.tdot i b { position: absolute; inset: 0; background: var(--ink-1); transform: scaleX(0); transform-origin: 0 50%; }
.tdot.done i b, html:not(.motion) .tdot[aria-selected="true"] i b { transform: none; }
.tdot[aria-selected="true"] { width: 52px; }
@media (max-width: 734px) {
  .hero { padding-top: 28px; }
  .hero > .wrap { width: calc(100% - 32px); }
  .byline { font-size: 17px; margin-bottom: 16px; }
  .byline img { width: 44px; height: 44px; }
  .hsub { font-size: 17px; line-height: 24px; max-width: 22em; }
  html[lang="th"] .hsub { line-height: 27px; }
  .ctas { gap: 12px 18px; margin-top: 20px; }
  .ctas .btn { min-height: 50px; width: min(100%, 350px); }

/* hero load choreography (06 H1-H3): transform only on the LCP h1 and stage */

@media (max-width: 734px) { @keyframes stageIn { from { transform: translateY(16px); } } }

const mIdx = (y, m) => (y - 2021) * 12 + (m - 5);
const NOW = (() => { const d = new Date(); return [d.getFullYear(), d.getMonth() + 1]; })();
const TOTAL = mIdx(NOW[0], NOW[1]) + 1;
const months = (c) => { const e = c.e || NOW; return mIdx(e[0], e[1]) - mIdx(c.s[0], c.s[1]) + 1; };
const fmtD = (ym) => ym ? MON[st.lang][ym[1] - 1] + ' ' + ym[0] : T().present;
function renderCareer() {

  // proportional rail
  let segs = '';

    const a = mIdx(c.s[0], c.s[1]); let b = c.e ? mIdx(c.e[0], c.e[1]) + 1 : TOTAL;

  });

  $('#rail').innerHTML = '<span class="rtrack"></span>' + segs + '<span class="rmark" id="rmark"><i></i><span id="rlab"></span></span><div class="ryears">' + (mqPhone.matches ? '' : '<span style="left:0%;transform:none">2021</span>') + yrs + '</div>';

function selectRole(i, user) {
  st.role = i;
  const t = T(), c = CAREER[i];
  $$('#pills .pb').forEach((b, j) => { b.setAttribute('aria-selected', String(j === i)); b.tabIndex = j === i ? 0 : -1; });
  const det = $('#detent'); det.style.transform = 'translateY(' + (i * 64) + 'px)';
  $$('.rseg').forEach((s) => s.classList.toggle('on', +s.dataset.i === i));
  // rail marker: centre of the role's segment, label clamped inside the rail
  const seg = $('.rseg[data-i="' + i + '"]'), rail = $('#rail');
  if (seg && rail.clientWidth) {
    const x = seg.offsetLeft + seg.offsetWidth / 2, W = rail.clientWidth;
    const lab = $('#rlab'); lab.textContent = c.co + ' · ' + months(c) + ' ' + t.mo;
    const lw = lab.offsetWidth || 120;
    let lx = -lw / 2; if (x + lx < 0) lx = -x; if (x - lw / 2 + lw > W) lx = W - x - lw;
    lab.style.setProperty('--lx', lx + 'px');
    $('#rmark').style.transform = 'translateX(' + x + 'px)';
  }
  const p = $('#panel');
  p.setAttribute('aria-labelledby', 'pb-' + c.id);

      '<p class="lcap">' + figs(L(ld.cap)) + '</p>';
  }
  h += '<ul class="bul">' + c.b[st.lang].map((s) => '<li>' + figs(s) + '</li>').join('') + '</ul><div class="pf">';
  if (c.deal) h += '<a href="#story" id="deallink"><span>' + tx(t.dealLink) + '</span></a>';
  if (CAREER[i + 1]) h += '<button type="button" data-earlier="' + (i + 1) + '">' + esc(t.earlier + CAREER[i + 1].co) + ' ›</button>';
  h += '</div>';
