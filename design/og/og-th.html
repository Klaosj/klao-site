<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>OG image — TH (1200x630)</title>
<style>
  /* Source for public/og/og-th.png. Regenerate: see design/og/README.md
     Thai has no Georgia glyphs, so the display face falls back to a Thai
     sans. Sizes are tuned down from the EN board because Thai ascenders +
     tone marks need more line-height at the same optical weight. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fafaf8;
    font-family: "Sukhumvit Set", "Noto Sans Thai", Thonburi,
                 -apple-system, BlinkMacSystemFont, sans-serif;
    color: #111111;
    -webkit-font-smoothing: antialiased;
  }
  .board { width: 1200px; height: 630px; display: flex; }
  .left {
    flex: 1.35; padding: 76px 56px 68px 92px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .right {
    flex: 1; border-left: 1px solid #e5e5e0; background: #ffffff;
    padding: 76px 68px 68px 56px;
    display: flex; flex-direction: column; justify-content: center; gap: 20px;
  }
  /* KLAO stays Latin serif in both locales — it is the wordmark, not copy. */
  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px; font-weight: 700; letter-spacing: 0.14em;
  }
  /* 43px, not the EN board's 62px: "นัก Business Development" must sit on one
     line — breaking a job title across lines is a typographic error, and it
     is the widest unbreakable run on this board. Thai also needs more
     line-height for tone marks, so the block still reads at a similar
     optical weight despite the smaller size. */
  .headline {
    font-size: 43px; line-height: 1.34; letter-spacing: -0.005em; font-weight: 600;
  }
  .rule { width: 84px; height: 3px; background: #111111; margin: 28px 0 22px; }
  .byline { font-size: 19px; color: #666666; line-height: 1.6; }
  .domain { font-family: Georgia, serif; font-size: 17px; letter-spacing: 0.04em; }
  .label {
    font-size: 13px; color: #666666; letter-spacing: 0.1em; margin-bottom: 4px;
  }
  .proj { border-bottom: 1px solid #e5e5e0; padding-bottom: 16px; }
  .proj:last-of-type { border-bottom: 0; padding-bottom: 0; }
  /* Project names are proper nouns — keep them Latin, matching the site. */
  .pname {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 24px; font-weight: 600; letter-spacing: -0.01em;
  }
  .pdesc { font-size: 15px; color: #666666; margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="board">
    <div class="left">
      <span class="wordmark">KLAO</span>
      <div>
        <h1 class="headline">นัก Business Development<br>ที่สร้างเครื่องมือใช้เอง</h1>
        <div class="rule"></div>
        <p class="byline">กรุงเทพฯ · BD × Data Analytics<br>สร้างแอปด้วย AI</p>
      </div>
      <span class="domain">klao.dev</span>
    </div>
    <div class="right">
      <div class="label">ผลงานเด่น</div>
      <div class="proj"><div class="pname">GoNai</div><div class="pdesc">วางแผนเที่ยว · Next.js</div></div>
      <div class="proj"><div class="pname">AISecretary</div><div class="pdesc">macOS menu bar · Swift</div></div>
      <div class="proj"><div class="pname">DailyBrief</div><div class="pdesc">ระบบข่าวอัตโนมัติ · Python</div></div>
    </div>
  </div>
</body>
</html>
