<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Share card — TH (1200×630)</title>
<link rel="stylesheet" href="card.css">
<style>
  /* TH: Anuphan 600 for the Thai, SF for the Latin inside it (card.css). Two explicit lines, broken at the space
     after "Development" exactly as the film's title card breaks it, so no line ever breaks inside a word. Thai
     needs the taller line for its tone marks. */
  .title { font-size: 56px; line-height: 76px; letter-spacing: 0; }
  .label { line-height: 24px; }
</style>
</head>
<body>
  <main class="card">
    <header class="head">
      <h1 class="title"><span class="ln">นัก Business Development</span><span class="ln">ที่สร้างเครื่องมือใช้เอง</span></h1>
      <p class="byline"><span class="name">Suwichak Jarunopratamp</span><span class="mark"></span><span class="url">klao-site.vercel.app</span></p>
    </header>
    <ul class="apps">
      <li class="app">
        <div class="frame"><img src="assets/gonai-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>GoNai</b> · เปิดใช้งานแล้ว</p>
      </li>
      <li class="app">
        <div class="frame"><img src="assets/aje-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>Aje</b> · Prototype ใช้งานได้</p>
      </li>
      <li class="app">
        <div class="frame"><img src="assets/cafenista-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>Cafénista</b> · Prototype · ข้อมูลจำลอง</p>
      </li>
    </ul>
  </main>
</body>
</html>
