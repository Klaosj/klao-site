<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card — EN (1200×630)</title>
<link rel="stylesheet" href="card.css">
<style>
  /* EN: the headline in the display serif, two lines exactly as the film's title card breaks it. */
  .title { font-family: "OG Display", serif; font-size: 64px; line-height: 68px; letter-spacing: -.012em; }
</style>
</head>
<body>
  <main class="card">
    <header class="head">
      <h1 class="title"><span class="ln">Business developer who</span><span class="ln">builds his own tools.</span></h1>
      <p class="byline"><span class="name">Suwichak Jarunopratamp</span><span class="mark"></span><span class="url">klao-site.vercel.app</span></p>
    </header>
    <ul class="apps">
      <li class="app">
        <div class="frame"><img src="assets/gonai-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>GoNai</b> · Live</p>
      </li>
      <li class="app">
        <div class="frame"><img src="assets/aje-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>Aje</b> · Working prototype</p>
      </li>
      <li class="app">
        <div class="frame"><img src="assets/cafenista-end.png" width="304" height="173" alt=""></div>
        <p class="label"><b>Cafénista</b> · Prototype · simulated data</p>
      </li>
    </ul>
  </main>
</body>
</html>
