<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1580, height=900" />
    <title>GoNai — landing to a planned day in baht</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #f5f6f8;
        --screen-bg: #ffffff; /* GoNai page background inside both captures */
        --hairline: rgba(0, 0, 0, 0.08);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1580px;
        height: 900px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }
      /* Full-bleed canvas fill as a child, so alpha/PNG-sequence renders stay opaque. */
      #canvas-bg {
        position: absolute;
        inset: 0;
        background: var(--canvas);
      }
      /* Frame 0: the site's screenshot (public/images/gonai.jpg), full-bleed at 1:1. */
      #landing {
        position: absolute;
        left: 0;
        top: 0;
        width: 1580px;
        height: 900px;
        display: block;
      }
      /* Screen frames: a clean rounded rect, 1px hairline, one soft shadow. */
      .device {
        position: absolute;
        top: 67px;
        height: 766px;
        overflow: hidden;
        background: var(--screen-bg);
        box-shadow:
          0 0 0 1px var(--hairline),
          var(--shadow);
        opacity: 0;
      }
      .device img {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      /* In-app "Your plan" at an 880 px window, 1x; centred first, then left. */
      #plan {
        left: 350px;
        width: 880px;
        border-radius: 18px;
      }
      #plan-page {
        width: 880px;
        height: 766px;
      }
      /* The same plan's view-only share page on a phone, final position on the right. */
      #phone {
        left: 1082px;
        width: 360px;
        border-radius: 36px;
      }
      #share-page {
        width: 360px;
        height: 766px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1580"
      data-height="900"
    >
      <div id="canvas-bg"></div>
      <img id="landing" src="assets/landing.jpg" alt="" />
      <div id="plan" class="device">
        <img id="plan-page" src="assets/plan.png" alt="" />
      </div>
      <div id="phone" class="device">
        <img id="share-page" src="assets/share.png" alt="" />
      </div>
    </div>
    <script>
      // Deterministic cubic-bezier easing (same math as CSS cubic-bezier()).
      function cubicBezier(p1x, p1y, p2x, p2y) {
        const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
        const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
        const sx = (t) => ((ax * t + bx) * t + cx) * t;
        const sy = (t) => ((ay * t + by) * t + cy) * t;
        const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
        function solveX(x) {
          let t = x;
          for (let i = 0; i < 8; i++) {
            const e = sx(t) - x;
            if (Math.abs(e) < 1e-7) return t;
            const d = dx(t);
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          let lo = 0, hi = 1;
          t = x;
          for (let i = 0; i < 40; i++) {
            const v = sx(t);
            if (Math.abs(v - x) < 1e-7) break;
            if (v < x) lo = t; else hi = t;
            t = (lo + hi) / 2;
          }
          return t;
        }
        return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : sy(solveX(x)));
      }
      // klao-site motion tokens
      const drift = cubicBezier(0.28, 0.11, 0.32, 1);
      const settle = cubicBezier(0.32, 0.72, 0, 1);

      const PLAN_SHIFT_X = -212; // centred (350) -> final left (138); phone sits at 1082

      const tl = gsap.timeline({ paused: true });
      // Resting states at t=0 (every later tween starts from these).
      tl.set("#landing", { opacity: 1, scale: 1 }, 0);
      tl.set("#plan", { opacity: 0, x: 0, y: 24 }, 0);
      tl.set("#phone", { opacity: 0, y: 24 }, 0);
      // 0.0–0.5 hold on the landing (frame 0 = the site's screenshot, untouched).
      // 0.5–1.0 the landing eases forward a touch and fades to the canvas
      // (short, so it is nearly gone before the plan starts: no double exposure).
      tl.to("#landing", { opacity: 0, duration: 0.5, ease: drift }, 0.5);
      tl.to("#landing", { scale: 1.03, duration: 0.5, ease: drift }, 0.5);
      // 0.9–2.1 the plan window rises in, centred.
      tl.to("#plan", { opacity: 1, duration: 0.8, ease: drift }, 0.9);
      tl.to("#plan", { y: 0, duration: 1.2, ease: settle }, 0.9);
      // 2.4–3.9 the window drifts left to make room.
      tl.to("#plan", { x: PLAN_SHIFT_X, duration: 1.5, ease: drift }, 2.4);
      // 3.05–4.2 the phone (same plan, shared view) rises in on the right, once the
      // window has all but cleared its slot.
      tl.to("#phone", { y: 0, duration: 1.15, ease: settle }, 3.05);
      tl.to("#phone", { opacity: 1, duration: 0.8, ease: drift }, 3.05);
      // 4.2–5.0 hold (root data-duration governs length).
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
