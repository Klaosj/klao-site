<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1580, height=900" />
    <title>Cafénista — owner timeline to bar check shot</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #f5f6f8;
        --screen-bg: #f2f2f7; /* page background inside both renders */
        --hairline: rgba(0, 0, 0, 0.08);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1580px;
        height: 900px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }
      /* Full-bleed canvas fill as a child, so alpha/PNG-sequence renders stay opaque. */
      #canvas-bg {
        position: absolute;
        inset: 0;
        background: var(--canvas);
      }
      /* Screen frames: a clean rounded rect, 1px hairline, one soft shadow. */
      .device {
        position: absolute;
        top: 60px;
        height: 780px;
        overflow: hidden;
        background: var(--screen-bg);
        box-shadow:
          0 0 0 1px var(--hairline),
          var(--shadow);
      }
      .device img {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      /* Owner "วันนี้" screen: native 1x crop (800 px wide), centred at frame 0. */
      #owner {
        left: 390px;
        width: 800px;
        border-radius: 18px;
      }
      #owner-page {
        width: 800px;
        height: 2512px;
      }
      /* Bar phone: final position on the right. */
      #phone {
        left: 1042px;
        width: 360px;
        border-radius: 36px;
        opacity: 0;
      }
      #bar-page {
        width: 360px;
        height: 779px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1580"
      data-height="900"
    >
      <div id="canvas-bg"></div>
      <div id="owner" class="device">
        <img id="owner-page" src="assets/owner-today.png" alt="" data-layout-allow-overflow="true" />
      </div>
      <div id="phone" class="device">
        <img id="bar-page" src="assets/bar-alert-live.png" alt="" />
      </div>
    </div>
    <script>
      // Deterministic cubic-bezier easing (same math as CSS cubic-bezier()).
      function cubicBezier(p1x, p1y, p2x, p2y) {
        const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
        const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
        const sx = (t) => ((ax * t + bx) * t + cx) * t;
        const sy = (t) => ((ay * t + by) * t + cy) * t;
        const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
        function solveX(x) {
          let t = x;
          for (let i = 0; i < 8; i++) {
            const e = sx(t) - x;
            if (Math.abs(e) < 1e-7) return t;
            const d = dx(t);
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          let lo = 0, hi = 1;
          t = x;
          for (let i = 0; i < 40; i++) {
            const v = sx(t);
            if (Math.abs(v - x) < 1e-7) break;
            if (v < x) lo = t; else hi = t;
            t = (lo + hi) / 2;
          }
          return t;
        }
        return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : sy(solveX(x)));
      }
      // klao-site motion tokens
      const drift = cubicBezier(0.28, 0.11, 0.32, 1);
      const settle = cubicBezier(0.32, 0.72, 0, 1);

      // Layout constants (px). Owner page is shown at native 1x.
      const TOP_INSET = 24; // page-colour breathing room above the page top (frame 0)
      const SCROLL_TO = 1100; // native page y at the frame top when the scroll ends:
      // timeline card (1130–1578) + "ตอนนี้ที่บาร์" card, both cut edges fall on blank card rows
      const OWNER_SHIFT_X = -212; // centred (390) -> final left (178)

      const tl = gsap.timeline({ paused: true });
      // 0.0–0.5 hold. 0.5–2.4 scroll the page inside the owner frame.
      tl.fromTo(
        "#owner-page",
        { y: TOP_INSET },
        { y: -SCROLL_TO, duration: 1.9, ease: drift },
        0.5,
      );
      // 2.4–3.9 owner frame drifts left (clears the phone slot before the phone shows).
      tl.fromTo("#owner", { x: 0 }, { x: OWNER_SHIFT_X, duration: 1.5, ease: drift }, 2.4);
      // 3.0–4.2 bar phone rises in on the right.
      tl.set("#phone", { y: 24, opacity: 0 }, 0);
      tl.fromTo(
        "#phone",
        { y: 24 },
        { y: 0, duration: 1.2, ease: settle, immediateRender: false },
        3.0,
      );
      tl.fromTo(
        "#phone",
        { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: drift, immediateRender: false },
        3.0,
      );
      // 4.2–5.0 hold (root data-duration governs length).
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
