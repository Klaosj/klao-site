<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* ── klao-site frame (frame.md): quiet stage, the app is the only colour */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #F5F6F8; }
      #root { position: relative; width: 100%; height: 100%; background: #F5F6F8; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #F5F6F8; }   /* painted stage: survives transparent PNG/WebM capture */

      /* one hairline + one e2 shadow per surface (the e2 stack opens with the 1px hairline ring) */
      .surf {
        position: absolute; left: 0; top: 0; transform-origin: 0 0;
        box-shadow: 0 0 0 1px rgba(20,26,44,.05), 0 2px 4px rgba(20,26,44,.04), 0 12px 28px -8px rgba(20,26,44,.12);
      }
      /* phone-sized cut: the UI is re-composed bigger (2.76x), one surface at a time.
         Laid out at the app's 375-pt phone width (iPhone mini/SE: 375 x 812, cards 343 wide) so the
         app's smallest text (15 px) lands at 41.4 px here = 13.0 px on a 340 px phone column. */
      .z { zoom: 2.76; }
      .z-card { zoom: 2.76; width: 343px; }

      /* owner cards: the component is its own surface; radius = app radius 14 × 2.76 */
      #m-wrap, #a-wrap { width: 946.68px; border-radius: 38.64px; background: #fff; }

      /* bar: a window onto the phone screen (our phone radius 36), 1004 × 828 = 363.8 × 300 CSS px */
      .win { width: 1004px; height: 828px; border-radius: 36px; overflow: hidden; background: #F2F2F7; transform-origin: 50% 50%; }
      .win .z { position: absolute; left: 0; top: 0; }
      .screen { position: relative; width: 375px; height: 812px; background: var(--bg); }
      #h-screen { margin: -78px 0 0 -5.6px; }     /* home: CSS y 78–378 · alert card, hint, first bean */
      #s-screen { margin: -183px 0 0 -5.6px; }    /* saved: CSS y 183–483 · the saved body, centred (812-tall screen) */

      .pillSlot { display: grid; justify-items: end; }
      .pillSlot > * { grid-area: 1 / 1; }
      .headSlot { display: grid; }
      .headSlot > * { grid-area: 1 / 1; }
      .footSlot { display: grid; justify-items: end; }
      .footSlot > * { grid-area: 1 / 1; }
      .cf .t-sparkLine, .cf .t-sparkNormal { vector-effect: none; }
      /* the app colours this line by tone (accent → crit); one variable lets the flip be one tween */
      #m_spark { --spark: #6F4E37; }
      #m_spark .t-sparkLine { stroke: var(--spark); }
      #m_spark .t-sparkDot { fill: var(--spark); }
      .b-seg { transform-origin: 50% 50%; }
      /* parts of the screen outside each window's crop are not drawn (they would be clipped anyway) */
      #h-screen .b-header, #p_bean1, #p_bean2, #s-screen .b-savedActions { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1080">
      <div id="bg"></div>
      <div id="m-wrap" class="surf" data-layout-allow-overflow data-layout-allow-overlap><div class="cf z-card" id="m-ui"></div></div>
      <div id="a-wrap" class="surf" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion><div class="cf z-card" id="a-ui"></div></div>
      <div id="h-wrap" class="surf win" data-layout-allow-overflow data-layout-allow-overlap><div class="cf z"><div class="screen" id="h-screen"></div></div></div>
      <div id="s-wrap" class="surf win" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion><div class="cf z"><div class="screen" id="s-screen"></div></div></div>
    </div>

    <script src="ui.js"></script>
    <script>
      /* =====================================================================
         Cafénista UI sting · square 1080×1080 · 30 fps · 5.0 s · plays once, holds.
         Re-composed for a ~340 px phone column: UI at 2.76× (375-pt layout), one surface at a time.
         build 0.2–1.6   the machine card goes cold; the owner's alert rises over it
         breathe 1.6–3.6 the same alert on the bar screen (one move: the handoff)
         resolve 3.6–4.4 one tap on "พอดี" · the app's own "บันทึกแล้ว" layer
         ===================================================================== */
      document.getElementById('m-ui').innerHTML = CF.machineCard('m_');
      document.getElementById('a-ui').innerHTML = CF.ownerAlert('a_');
      document.getElementById('h-screen').innerHTML = CF.barHome('p_');
      document.getElementById('s-screen').innerHTML = CF.savedScreen('p_');

      function bezier(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const sx = (t) => ((ax * t + bx) * t + cx) * t;
        const sy = (t) => ((ay * t + by) * t + cy) * t;
        const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = sx(t) - p, d = dx(t);
            if (Math.abs(e) < 1e-7) return sy(t);
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          let lo = 0, hi = 1; t = p;
          for (let i = 0; i < 40; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
          return sy(t);
        };
      }
      const ARRIVE = bezier(.32, .72, 0, 1);     // --ease-settle
      const MOVE   = bezier(.28, .11, .32, 1);    // --ease-drift
      const LEAVE  = bezier(.4, 0, 1, 1);         // --ease-exit
      const PRESS  = bezier(.34, 1.56, .64, 1);   // --ease-tick · the one overshoot, on the press only
      const APP    = bezier(.2, .7, .3, 1);       // Cafénista's own --motion (140 ms) for in-app state changes

      const S = 2.76;
      const CARD_W = 343 * S, CARD_H = 232 * S;
      // Round 3: the machine card steps back to 0.96, frame.md's gentlest step-back (was 0.9). Text in a
      // stepped-back surface must still clear frame.md's minimum: 15 px app text × 2.76 × 0.96 = 39.7 px
      // here = 13.2 px in the 358.8 px phone video box (0.9 gave 12.4 px Thai on the chip "เย็นกว่าปกติ").
      const K = 0.96;                                  // machine card steps back under the alert
      const FOOT_Y = 171 * S * K + 3;                  // the alert's top sits 3 px below the foot's top (css 171)
      const M1_Y = 85;                                 // margins: top 85 · bottom 96 under the alert (pilot 98 · 111)
      const pos = {
        m0: { x: (1080 - CARD_W) / 2, y: (1080 - CARD_H) / 2 },                 // poster
        m1: { x: (1080 - CARD_W * K) / 2, y: M1_Y, s: K },                       // behind the alert
        a1: { x: (1080 - CARD_W) / 2, y: M1_Y + FOOT_Y },                        // covers the card's foot
        w:  { x: (1080 - 1004) / 2, y: (1080 - 828) / 2 },                       // bar window
      };

      const tl = gsap.timeline({ paused: true });
      const line = document.querySelector('#m_spark polyline');
      const norm = document.querySelector('#m_spark line');
      const dot = document.querySelector('#m_spark circle');

      /* ── rest state (frame 0 = poster) · immediate sets, outside the paused timeline */
      gsap.set('#m-wrap', { x: pos.m0.x, y: pos.m0.y, scale: 1, opacity: 1 });
      gsap.set('#a-wrap', { x: pos.a1.x, y: 1000, opacity: 0 });
      gsap.set(['#h-wrap', '#s-wrap'], { x: pos.w.x, y: pos.w.y });
      gsap.set('#h-wrap', { y: pos.w.y + 64, opacity: 0 });
      gsap.set('#s-wrap', { opacity: 0 });
      gsap.set(['#m_pillCrit', '#m_headCrit', '#m_footCrit'], { opacity: 0 });
      gsap.set('#m_headCrit', { y: 8 });
      gsap.set('#m_pillCrit', { scale: 0.92, transformOrigin: '100% 50%' });
      gsap.set('#p_checkPath', { strokeDasharray: 16, strokeDashoffset: 16 });

      /* ── BUILD · the reading falls away from the machine's own normal (real autoscale) */
      const chart = { s: 0 };                       // 0 = dashboard-normal, 1 = dashboard-alert (sparkGeometry)
      const drawChart = () => {
        const g = CF.geometry(chart.s);
        line.setAttribute('points', g.line);
        norm.setAttribute('y1', g.normalY); norm.setAttribute('y2', g.normalY);
        dot.setAttribute('cy', g.dot.y);
      };
      tl.fromTo(chart, { s: 0 }, { s: 1, duration: 0.6, ease: MOVE, onUpdate: drawChart }, 0.2);
      tl.to('#m_headOk', { opacity: 0, y: -8, duration: 0.15, ease: LEAVE }, 0.6);
      tl.to('#m_headCrit', { opacity: 1, y: 0, duration: 0.3, ease: ARRIVE }, 0.733);
      // the alert opens: chip, line tone and the last reading's time flip together (the app swaps them in
      // one render). Round 3: the foot's time joins the chip's tween, 08:44 → 08:46 (scale is a no-op on it).
      tl.to(['#m_pillOk', '#m_pillCrit', '#m_footOk', '#m_footCrit'], { opacity: (i) => i % 2, scale: 1, duration: 0.24, ease: APP }, 0.733);
      tl.to('#m_spark', { '--spark': '#D03B3B', duration: 0.24, ease: APP }, 0.733);
      // the owner's alert rises over the card; the card steps back but keeps its reading in view
      tl.to('#m-wrap', { x: pos.m1.x, y: pos.m1.y, scale: pos.m1.s, opacity: 0.6, duration: 0.7, ease: MOVE }, 0.95);
      // it rises from the lower edge; the fade is done before it reaches any text, so nothing reads through it
      tl.to('#a-wrap', { y: pos.a1.y, duration: 0.7, ease: ARRIVE }, 1.05);
      tl.to('#a-wrap', { opacity: 1, duration: 0.12, ease: 'none' }, 1.05);

      /* ── BREATHE · handoff to the bar screen (the owner's alert is gone before the bar's appears) */
      // matched vectors: the owner's stack leaves upward, the bar screen rises in on the same axis
      tl.to(['#m-wrap', '#a-wrap'], { opacity: 0, y: (i) => [pos.m1.y, pos.a1.y][i] - 64, duration: 0.25, ease: LEAVE }, 2.05);
      tl.to('#h-wrap', { y: pos.w.y, opacity: 1, duration: 0.6, ease: ARRIVE }, 2.3);    // round 2: starts as the owner stack reaches 0 (was 2.25, a 2-frame overlap of the two alert cards)

      /* ── RESOLVE · one tap on "พอดี" → the app's own saved layer over the screen */
      tl.to('#p_seg0_1', { scale: 0.97, duration: 0.12, ease: APP }, 3.6);              // :active (app: scale .97)
      tl.to('#p_seg0_1', { scale: 1, duration: 0.2, ease: PRESS }, 3.72);                // release · the one overshoot
      tl.to('#p_segOn0_1', { opacity: 1, duration: 0.14, ease: APP }, 3.72);             // aria-pressed · reads for ~0.15 s
      tl.to('#s-wrap', { opacity: 1, duration: 0.28, ease: ARRIVE }, 3.867);             // overlay (app: fadeIn · opacity only)
      tl.to('#p_checkPath', { strokeDashoffset: 0, duration: 0.36, ease: MOVE }, 4.0);
      tl.set('#h-wrap', { visibility: 'hidden' }, 4.15);                                  // covered + inert under the overlay

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
