<!-- Fixture placeholder only (src/content/fixtures/projects.json).
     Deliberately text-free. The previous version drew the project name at
     64px, the tagline, and the stack, i.e. the same three facts the deck's
     own text column renders 400px away, and it did so on a #101013 card
     that sank into the bg-dark band while the two real screenshots beside
     it are bright. Any word here is a word the deck already said, and no
     words also means nothing to translate on /th. Light ground plus
     low-opacity periwinkle geometry, so all four slides carry imagery of
     the same weight and the band's rhythm can finally be judged. 800x450
     (16:9) matches the intrinsic width/height the deck markup declares, so
     the box reserved for it is unchanged.
     (Note for future edits: XML forbids a double hyphen inside a comment,
     so this file's prose uses commas where the codebase's TS/CSS comments
     would use an em dash.) -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="ai-glow" cx="60%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#a8aecb" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#a8aecb" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a8aecb" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#fafafd" />
  <rect width="800" height="450" fill="url(#ai-glow)" />
  <!-- Three broken concentric rings. stroke-dasharray splits each ring into
       one long arc and one gap; each dash+gap pair sums to that circle's own
       circumference (2*pi*r = 1056 / 792 / 528), so the pattern lands exactly
       once per revolution instead of seaming. -->
  <g fill="none" stroke="#7d86ad" stroke-linecap="round" transform="rotate(-38 480 208)">
    <circle cx="480" cy="208" r="168" stroke-width="1.5" stroke-opacity="0.16" stroke-dasharray="742 314" />
    <circle cx="480" cy="208" r="126" stroke-width="2" stroke-opacity="0.26" stroke-dasharray="475 317" />
    <circle cx="480" cy="208" r="84" stroke-width="2.5" stroke-opacity="0.38" stroke-dasharray="330 198" />
  </g>
  <circle cx="480" cy="208" r="30" fill="#a8aecb" fill-opacity="0.30" />
  <g fill="#7d86ad" fill-opacity="0.22">
    <rect x="72" y="352" width="132" height="3" rx="1.5" />
    <rect x="72" y="372" width="76" height="3" rx="1.5" />
  </g>
</svg>
